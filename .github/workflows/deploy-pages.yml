name: Deploy to GitHub Pages

# Ensure the workflow has permission to create/update Pages
permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If you have a build step (npm, hugo, etc), run it here and emit output into ./docs
      # - name: Build
      #   run: |
      #     npm ci
      #     npm run build
      #     # ensure output is in ./docs

      # Create/ensure the Pages site is configured for this repo
      - name: Configure Pages
        uses: actions/configure-pages@v2

      # Upload the ./docs directory as the artifact to be deployed
      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./docs

      # Deploy the uploaded artifact to GitHub Pages
      - name: Deploy to Pages
        uses: actions/deploy-pages@v1
